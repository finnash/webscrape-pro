<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https:; style-src 'self' 'unsafe-inline'" />
<style>
  :root { --bg: rgba(14,14,20,.82); --fg:#f2f0ff; --mut:#8d8aa6; --acc:#ff8a3d; --acc2:#b56cff; }
  * { box-sizing: border-box; margin: 0; }
  html,body { background: transparent; font: 13px -apple-system, "SF Pro Text", sans-serif; color: var(--fg); overflow: hidden; user-select: none; }
  .card { margin: 10px; border-radius: 22px; background: var(--bg); backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 50px rgba(0,0,0,.45); padding: 14px; -webkit-app-region: drag; }
  .top { display:flex; justify-content:space-between; align-items:center; font-weight:600; letter-spacing:.2px; }
  .top span { color: var(--mut); font-weight: 500; font-size: 11px; }
  .x { -webkit-app-region:no-drag; cursor:pointer; color:var(--mut); padding:2px 6px; border-radius:6px; }
  .x:hover { background: rgba(255,255,255,.08); color: var(--fg); }
  canvas { display:block; width:100%; height:120px; margin:8px 0; }
  .mic { -webkit-app-region:no-drag; display:block; margin:0 auto; width:62px; height:62px; border-radius:50%; border:0; cursor:pointer;
    background: radial-gradient(circle at 30% 30%, var(--acc), var(--acc2)); box-shadow: 0 0 0 0 rgba(255,138,61,.5); transition: transform .15s; }
  .mic:active { transform: scale(.94); }
  .mic.on { animation: pulse 1.4s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 16px rgba(255,138,61,0); } }
  .status { text-align:center; color:var(--mut); margin:10px 0 6px; min-height:16px; }
  .shimmer { background: linear-gradient(90deg, var(--mut) 30%, var(--fg) 50%, var(--mut) 70%); background-size:200% 100%;
    -webkit-background-clip:text; color:transparent; animation: sh 2s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .out { -webkit-app-region:no-drag; max-height:150px; overflow:auto; white-space:pre-wrap; line-height:1.45; user-select:text;
    background: rgba(255,255,255,.04); border-radius:12px; padding:10px; display:none; }
  input { -webkit-app-region:no-drag; width:100%; margin-top:6px; padding:8px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05); color: var(--fg); outline:none; }
  button.b { -webkit-app-region:no-drag; margin-top:8px; width:100%; padding:8px; border-radius:10px; border:0; cursor:pointer; font-weight:600;
    background: linear-gradient(90deg, var(--acc), var(--acc2)); color:#120c1c; }
  .hidden { display:none !important; }
  .hint { color: var(--mut); font-size: 11px; text-align:center; margin-top:6px; }
</style>
</head>
<body>
<div class="card">
  <div class="top">Meow Voice <span id="who"></span><div><a class="x" id="hide">–</a><a class="x" id="quit">×</a></div></div>

  <div id="setup" class="hidden">
    <input id="email" placeholder="Meow Scraper email" />
    <input id="pass" type="password" placeholder="Password" />
    <input id="hook" placeholder="Discord webhook URL (optional)" />
    <button class="b" id="save">Sign in</button>
  </div>

  <div id="main" class="hidden">
    <canvas id="wave" width="720" height="240"></canvas>
    <button class="mic" id="mic" title="Option + Space"></button>
    <div class="status" id="status">Press ⌥ Space and speak</div>
    <div class="out" id="out"></div>
    <input id="typed" placeholder="…or type a command and press Enter" />
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
